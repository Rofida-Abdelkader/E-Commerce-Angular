<div class="card h-100 border-0 product-card shadow-sm rounded-4 overflow-hidden">

  <!-- Image Container -->
  <div class="image-wrapper position-relative d-flex align-items-center justify-content-center p-4">
    <img [src]="product.image" class="img-fluid product-img" [alt]="product.title">

    <span class="badge category-badge position-absolute top-0 start-0 m-3 rounded-pill">
      {{ product.category }}
    </span>
  </div>

  <!-- Body -->
  <div class="card-body d-flex flex-column p-4">

    <h6 class="product-title fw-semibold mb-0" [title]="product.title">
      {{ product.title }}
    </h6>

    <div class="price-section d-flex align-items-baseline gap-1 my-3">
      <span class="currency fw-bold">$</span>
      <span class="price-value fw-bold">{{ product.price }}</span>
    </div>

    <button class="btn btn-add-cart mt-auto w-100 rounded-3"
            (click)="add()">
      <i class="bi bi-cart-plus me-2"></i>
      Add to Cart
    </button>

  </div>

</div>
