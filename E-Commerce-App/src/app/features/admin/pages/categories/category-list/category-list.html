<div class="page-header">
  <h1>Categories</h1>
  <a routerLink="/admin/categories/add" class="btn-primary">+ Add Category</a>
</div>

<div *ngIf="loading" class="loading">Loading...</div>
<div *ngIf="error" class="error">{{ error }}</div>

<table *ngIf="!loading && categories.length > 0">
  <thead>
    <tr>
      <th>#</th>
      <th>Name</th>
      <th>Description</th>
      <th>Actions</th>
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let cat of categories">
      <td>{{ cat.id }}</td>
      <td>{{ cat.name }}</td>
      <td>{{ cat.description }}</td>
      <td class="actions">
        <a [routerLink]="['/admin/categories/edit', cat.id]" class="btn-edit">Edit</a>
        <button (click)="delete(cat.id)" class="btn-delete">Delete</button>
      </td>
    </tr>
  </tbody>
</table>

<div *ngIf="!loading && categories.length === 0" class="empty">
  No categories found.
</div>
