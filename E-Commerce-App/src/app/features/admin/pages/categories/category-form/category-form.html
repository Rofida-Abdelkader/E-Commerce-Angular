<div class="form-container">
  <div class="form-header">
    <h1>{{ isEdit ? 'Edit Category' : 'Add Category' }}</h1>
    <a routerLink="/admin/categories" class="btn-back">← Back</a>
  </div>

  <div *ngIf="error" class="error">{{ error }}</div>

  <form [formGroup]="form" (ngSubmit)="onSubmit()">
    <div class="form-group">
      <label>Name</label>
      <input type="text" formControlName="name" placeholder="Category name" />
      <span class="validation-error"
        *ngIf="name?.invalid && name?.touched">
        Name is required (min 3 characters)
      </span>
    </div>

    <div class="form-group">
      <label>Description</label>
      <textarea formControlName="description" placeholder="Category description" rows="4"></textarea>
      <span class="validation-error"
        *ngIf="description?.invalid && description?.touched">
        Description is required
      </span>
    </div>

    <button type="submit" class="btn-submit" [disabled]="form.invalid || loading">
      {{ loading ? 'Saving...' : isEdit ? 'Update' : 'Create' }}
    </button>
  </form>
</div>
