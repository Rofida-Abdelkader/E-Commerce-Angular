<div class="form-container">
  <div class="form-header">
    <h1>{{ isEdit ? 'Edit Product' : 'Add Product' }}</h1>
    <a routerLink="/admin/products" class="btn-back">← Back</a>
  </div>

  <div *ngIf="error" class="error">{{ error }}</div>

  <form [formGroup]="form" (ngSubmit)="onSubmit()">

    <div class="form-group">
      <label>Name</label>
      <input type="text" formControlName="name" placeholder="Product name" />
      <span class="validation-error" *ngIf="name?.invalid && name?.touched">
        Name is required (min 3 characters)
      </span>
    </div>

    <div class="form-group">
      <label>Description</label>
      <textarea formControlName="description" placeholder="Product description" rows="4"></textarea>
      <span class="validation-error" *ngIf="description?.invalid && description?.touched">
        Description is required
      </span>
    </div>

    <div class="form-group">
      <label>Price</label>
      <input type="number" formControlName="price" placeholder="0.00" step="0.01" />
      <span class="validation-error" *ngIf="price?.invalid && price?.touched">
        Price is required and must be greater than 0
      </span>
    </div>

    <div class="form-group">
      <label>Category</label>
      <select formControlName="categoryId">
        <option value="" disabled>Select a category</option>
        <option *ngFor="let cat of categories" [value]="cat.id">{{ cat.name }}</option>
      </select>
      <span class="validation-error" *ngIf="categoryId?.invalid && categoryId?.touched">
        Category is required
      </span>
    </div>

    <div class="form-group">
      <label>Product Image</label>
      <input type="file" accept="image/*" (change)="onFileChange($event)" />
      <div *ngIf="imagePreview" class="image-preview">
        <img [src]="imagePreview" alt="Preview" />
      </div>
    </div>

    <button type="submit" class="btn-submit" [disabled]="form.invalid || loading">
      {{ loading ? 'Saving...' : isEdit ? 'Update Product' : 'Create Product' }}
    </button>

  </form>
</div>
