<div class="form-container">
  <div class="form-header">
    <a routerLink="/admin/categories" class="back-btn">← Back</a>
    <h1>{{ isEdit ? 'Edit Category' : 'Add New Category' }}</h1>
  </div>

  @if (loading) {
    <div class="loading">Loading...</div>
  } @else {
    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="category-form">
      <div class="form-group">
        <label>Category Name *</label>
        <input formControlName="name" type="text" placeholder="e.g. Electronics" />
        @if (isInvalid('name')) { <span class="error">Name is required (min 2 chars)</span> }
      </div>

      <div class="form-group">
        <label>Slug *</label>
        <input formControlName="slug" type="text" placeholder="e.g. electronics" />
        @if (isInvalid('slug')) { <span class="error">Slug is required</span> }
      </div>

      <div class="form-actions">
        <a routerLink="/admin/categories" class="btn-secondary">Cancel</a>
        <button type="submit" class="btn-primary" [disabled]="submitting">
          {{ submitting ? 'Saving...' : (isEdit ? 'Update Category' : 'Add Category') }}
        </button>
      </div>
    </form>
  }
</div>
