<div class="auth-container">
  <div class="auth-card">
    <div class="auth-header">
      <h2>Create Account</h2>
      <p>Join our e-commerce platform today</p>
    </div>

    <form [formGroup]="registerForm" (ngSubmit)="onRegister()">
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" formControlName="username" placeholder="Enter your username">
      </div>

      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" formControlName="email" placeholder="name@example.com">
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" formControlName="password" placeholder="Minimum 6 characters">
      </div>

      <div class="form-group">
        <label for="role">Account Type</label>
        <select id="role" formControlName="role">
          <option value="user">Standard User</option>
          <option value="admin">Administrator</option>
        </select>
      </div>

      <button type="submit" class="btn-submit" [disabled]="registerForm.invalid">
        Register Now
      </button>

      <div class="auth-footer">
        <p>Already have an account? <a routerLink="/auth/login">Login here</a></p>
      </div>
    </form>
  </div>
</div>
